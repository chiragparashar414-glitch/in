<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VyaHotstar - Shorts</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #080b14;
    color: #fff;
}

/* MAIN PAGE LAYOUT */
.page-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 310px;
    gap: 24px;
    padding: 24px;
    max-width: 1600px;
    margin: auto;
    align-items: start;
}

/* MAIN CONTENT */
.main-content {
    min-width: 0;
    min-height: 500px;
    background: #111522;
    border-radius: 14px;
    padding: 24px;
}

.main-content h1 {
    font-size: 28px;
    margin-bottom: 12px;
}

.main-content p {
    color: #aeb6c8;
    line-height: 1.7;
}

/* SHORTS SIDEBAR */
.shorts-sidebar {
    width: 100%;
    background: #111522;
    border: 1px solid #252b3b;
    border-radius: 16px;
    padding: 15px;
    position: sticky;
    top: 20px;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #414a60 #111522;
}

/* SIDEBAR HEADER */
.shorts-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
}

.shorts-title {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 20px;
    font-weight: 700;
}

.shorts-icon {
    color: #ff3155;
    font-size: 25px;
}

.shuffle-btn {
    background: #252b3b;
    color: white;
    border: none;
    padding: 9px 11px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

.shuffle-btn:hover {
    background: #ff3155;
}

/* VIDEO LIST */
.shorts-list {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
}

/* VIDEO CARD */
.short-card {
    background: #191f2e;
    border: 1px solid #292f40;
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s;
}

.short-card:hover {
    transform: translateY(-3px);
    border-color: #ff3155;
}

/* VERTICAL VIDEO */
.video-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16;
    background: #000;
    overflow: hidden;
}

.video-frame iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

/* VIDEO INFORMATION */
.video-info {
    padding: 12px;
}

.video-info h3 {
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 7px;
}

.video-info a {
    color: #ff526d;
    font-size: 12px;
    text-decoration: none;
}

.video-info a:hover {
    text-decoration: underline;
}

/* MOBILE RESPONSIVE */
@media (max-width: 900px) {
    .page-layout {
        grid-template-columns: 1fr;
        padding: 14px;
    }

    .shorts-sidebar {
        position: static;
        max-height: none;
        overflow: visible;
    }

    .shorts-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 480px) {
    .shorts-list {
        grid-template-columns: 1fr;
    }

    .main-content {
        padding: 18px;
    }
}
</style>
</head>

<body>

<div class="page-layout">

    <!-- YOUR MAIN WEBSITE CONTENT -->
    <main class="main-content">
        <h1>Welcome to VyaHotstar</h1>
        <p>
            Add your movies, TV shows, homepage sections,
            or other website content here.
        </p>
    </main>

    <!-- YOUTUBE SHORTS SIDEBAR -->
    <aside class="shorts-sidebar">

        <div class="shorts-header">
            <div class="shorts-title">
                <span class="shorts-icon">▶</span>
                <span>Shorts</span>
            </div>

            <button
                class="shuffle-btn"
                id="shuffleBtn"
                type="button"
                title="Shuffle videos"
            >
                🔀 Shuffle
            </button>
        </div>

        <!-- All videos are inserted here -->
        <div class="shorts-list" id="shortsList"></div>

    </aside>

</div>

<script>
const videoIds = [
    "gkHKxnaPSC0",
    "3NxmfLkBd1E",
    "gPceQU6wrQw",
    "gFFCLwGOUqs",
    "BqyQ6koskeQ",
    "_8aCcRdCGuk",
    "zewR5bkSPpo",
    "S_TxJxp9d78",
    "b7ewsPK2B9U",
    "ZFgQ5jYwvfI",
    "Y2yoA5v4160",
    "sQeOtxpw-uE",
    "xe0ze83fKfA",
    "TqeWNmzOgv8",
    "aJbKees5_gs"
];

const shortsList = document.getElementById("shortsList");
const shuffleBtn = document.getElementById("shuffleBtn");

/* Randomize video order */
function shuffleVideos(videos) {
    const shuffled = [...videos];

    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[j]] =
        [shuffled[j], shuffled[i]];
    }

    return shuffled;
}

/* Create every video card at once */
function loadShorts() {
    const shuffledVideos = shuffleVideos(videoIds);

    shortsList.innerHTML = shuffledVideos.map((id, index) => `
        <article class="short-card">
            <div class="video-frame">
                <iframe
                    src="https://www.youtube-nocookie.com/embed/${id}"
                    title="YouTube Short ${index + 1}"
                    loading="eager"
                    allow="accelerometer; autoplay; clipboard-write;
                           encrypted-media; gyroscope; picture-in-picture;
                           web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>
            </div>

            <div class="video-info">
                <h3>YouTube Short #${index + 1}</h3>
                <a
                    href="https://www.youtube.com/shorts/${id}"
                    target="_blank"
                    rel="noopener noreferrer">
                    Watch on YouTube ↗
                </a>
            </div>
        </article>
    `).join("");
}

/* Shuffle without reloading the page */
shuffleBtn.addEventListener("click", loadShorts);

/* Load all 15 videos in random order on page load */
loadShorts();
</script>

</body>
</html>
