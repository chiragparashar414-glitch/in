<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VyaHotstar Shorts</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #080a10;
    --panel: #141722;
    --accent: #ff3155;
}

body {
    background: var(--bg);
    color: white;
    font-family: Arial, sans-serif;
}

.page-layout {
    max-width: 1500px;
    min-height: 100vh;
    margin: auto;
    padding: 20px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 480px;
    gap: 25px;
    align-items: start;
}

.main-content {
    background: var(--panel);
    border-radius: 16px;
    padding: 25px;
    min-height: 300px;
}

.main-content h1 {
    margin-bottom: 12px;
}

.main-content p {
    color: #aeb5c5;
    line-height: 1.7;
}

/* SHORTS SIDEBAR */
.shorts-sidebar {
    width: 100%;
    position: sticky;
    top: 15px;
    background: #0c0e15;
    border: 1px solid #242838;
    border-radius: 18px;
    overflow: hidden;
}

.shorts-header {
    height: 60px;
    padding: 0 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #262a38;
}

.shorts-title {
    font-size: 19px;
    font-weight: bold;
}

.shuffle-btn {
    background: #252a39;
    color: white;
    border: 0;
    border-radius: 8px;
    padding: 9px 12px;
    cursor: pointer;
}

.shuffle-btn:hover {
    background: var(--accent);
}

/* VERTICAL SHORTS FEED */
.shorts-list {
    height: min(820px, calc(100vh - 95px));
    overflow-y: auto;
    overscroll-behavior-y: contain;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: #42485b transparent;
}

.short-card {
    height: min(820px, calc(100vh - 95px));
    min-height: 450px;
    width: 100%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow: hidden;
}

.video-frame {
    width: 100%;
    height: 100%;
    max-width: 460px;
    position: relative;
    background: #000;
    overflow: hidden;
}

.player-slot {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: #000;
}

.player-slot iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

/* VIDEO OVERLAY */
.video-overlay {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px 12px;
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,.35),
        transparent 22%,
        transparent 65%,
        rgba(0,0,0,.60)
    );
}

.video-top,
.video-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.video-label {
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 1px 5px #000;
}

.video-number {
    background: rgba(0,0,0,.65);
    padding: 6px 9px;
    border-radius: 20px;
    font-size: 12px;
}

.video-caption {
    font-size: 13px;
    text-shadow: 0 1px 5px black;
}

/* RIGHT-SIDE BUTTONS */
.side-actions {
    position: absolute;
    z-index: 5;
    right: 12px;
    bottom: 90px;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.action-button {
    width: 48px;
    min-height: 53px;
    border: 0;
    border-radius: 25px;
    background: rgba(20,23,34,.90);
    color: white;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 4px;
    backdrop-filter: blur(8px);
    text-decoration: none;
}

.action-button:hover {
    background: #303547;
}

.action-button .symbol {
    font-size: 23px;
    line-height: 1;
}

.action-button .count {
    font-size: 10px;
}

.like-button.liked {
    color: #ff4164;
}

/* PLAY/PAUSE */
.play-button {
    position: absolute;
    z-index: 6;
    left: 12px;
    bottom: 83px;
    width: 45px;
    height: 45px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 50%;
    background: rgba(0,0,0,.75);
    color: white;
    font-size: 19px;
    cursor: pointer;
    display: grid;
    place-items: center;
}

.play-button:hover {
    background: var(--accent);
}

/* STATUS MESSAGE */
.player-status {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    color: #ddd;
    font-size: 13px;
    line-height: 1.6;
    background: #000;
    pointer-events: none;
}

.player-status.hidden {
    display: none;
}

.api-message {
    padding: 12px;
    font-size: 12px;
    line-height: 1.5;
    color: #aeb5c5;
    border-top: 1px solid #242838;
}

/* RESPONSIVE */
@media (max-width: 850px) {
    .page-layout {
        display: block;
        padding: 0;
    }

    .main-content {
        margin: 15px;
    }

    .shorts-sidebar {
        position: static;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
    }

    .shorts-list {
        height: calc(100dvh - 60px);
    }

    .short-card {
        height: calc(100dvh - 60px);
        min-height: 450px;
    }

    .video-frame {
        max-width: 100%;
    }
}
</style>
</head>

<body>

<div class="page-layout">

    </main>

    <aside class="shorts-sidebar">

        <header class="shorts-header">
            <div class="shorts-title">
                <span style="color:#ff3155">▶</span> Shorts
            </div>

            <button class="shuffle-btn" id="shuffleBtn">
                🔀 Shuffle
            </button>
        </header>

        <div class="shorts-list" id="shortsList"></div>

        <div class="api-message" id="apiMessage" aria-live="polite">
            Loading YouTube Shorts...
        </div>

    </aside>

</div>

<script>
/* ALL VIDEO IDS */
const videoIds = [
    "gkHKxnaPSC0",
    "3NxmfLkBd1E",
    "gPceQU6wrQw",
    "gFFCLwGOUqs",
    "BqyQ6koskeQ",
    "_8aCcRdCGuk",
    "zewR5bkSPpo",
    "S_TxJxp9d78",
    "b7ewsPK2B9U",
    "ZFgQ5jYwvfI",
    "Y2yoA5v4160",
    "sQeOtxpw-uE",
    "xe0ze83fKfA",
    "TqeWNmzOgv8",
    "aJbKees5_gs"
];

const shortsList = document.getElementById("shortsList");
const apiMessage = document.getElementById("apiMessage");
const shuffleBtn = document.getElementById("shuffleBtn");

let cards = [];
let players = new Map();
let activeCard = null;
let observer = null;
let apiReady = false;
const likedVideos = new Set();

/* RANDOM VIDEO ORDER */
function shuffleVideos(array) {
    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
}

/* CREATE ALL SHORTS CARDS */
function renderShorts() {
    const orderedIds = shuffleVideos(videoIds);

    shortsList.innerHTML = orderedIds.map((id, index) => `
        <article class="short-card" data-id="${id}">

            <div class="video-frame">

                <div class="player-slot" id="player-${id}"></div>

                <div class="player-status" id="status-${id}">
                    Connecting to YouTube...
                </div>

                <div class="video-overlay">
                    <div class="video-top">
                        <span class="video-label">▶ VyaHotstar</span>
                        <span class="video-number">
                            ${index + 1} / ${orderedIds.length}
                        </span>
                    </div>

                    <div class="video-bottom">
                        <span class="video-caption">
                            Shorts · ${index + 1}
                        </span>
                    </div>
                </div>

                <button
                    class="play-button"
                    data-action="play"
                    data-id="${id}"
                    aria-label="Play or pause video">
                    ▶
                </button>

                <div class="side-actions">

                    <button
                        class="action-button like-button"
                        data-action="like"
                        data-id="${id}"
                        aria-pressed="false">
                        <span class="symbol">♥</span>
                        <span class="count" id="likes-${id}">Like</span>
                    </button>

                    <button
                        class="action-button"
                        data-action="share"
                        data-id="${id}">
                        <span class="symbol">↗</span>
                        <span class="count">Share</span>
                    </button>

                    <a
                        class="action-button"
                        href="https://www.youtube.com/shorts/${id}"
                        target="_blank"
                        rel="noopener noreferrer">
                        <span class="symbol">⤢</span>
                        <span class="count">Open</span>
                    </a>

                </div>
            </div>
        </article>
    `).join("");

    cards = [...shortsList.querySelectorAll(".short-card")];

    if (apiReady) {
        initializePlayers();
    }
}

/* INITIALIZE ALL PLAYERS */
function initializePlayers() {
    cards.forEach(card => createPlayer(card));
    setupObserver();
}

/* CREATE YOUTUBE PLAYER */
function createPlayer(card) {
    const id = card.dataset.id;

    if (!apiReady || players.has(id)) return;

    const slot = document.getElementById(`player-${id}`);
    if (!slot) return;

    const player = new YT.Player(slot, {
        width: "100%",
        height: "100%",
        videoId: id,

        playerVars: {
            autoplay: 0,
            controls: 1,
            playsinline: 1,
            rel: 0,
            enablejsapi: 1,
            origin: location.origin
        },

        events: {
            onReady: function(event) {
                const status = document.getElementById(`status-${id}`);

                if (status) {
                    status.classList.add("hidden");
                }

                /* Play only the visible video */
                if (card === activeCard) {
                    playActiveVideo(card);
                }
            },

            onStateChange: function(event) {
                updatePlayButton(id, event.data);

                if (event.data === YT.PlayerState.ENDED) {
                    playNextVideo(card);
                }
            },

            onError: function(event) {
                const status = document.getElementById(`status-${id}`);

                if (status) {
                    status.classList.remove("hidden");
                    status.textContent =
                        "This video cannot play here. Try opening it on YouTube.";
                }

                console.warn("YouTube player error:", id, event.data);
            }
        }
    });

    players.set(id, player);
}

/* YOUTUBE API READY CALLBACK */
window.onYouTubeIframeAPIReady = function() {
    apiReady = true;
    apiMessage.textContent =
        "Scroll through the Shorts. Only the active video plays.";

    initializePlayers();
};

/* LOAD THE API AFTER REGISTERING ITS CALLBACK */
const youtubeScript = document.createElement("script");
youtubeScript.src = "https://www.youtube.com/iframe_api";
youtubeScript.async = true;
youtubeScript.onerror = function() {
    apiMessage.textContent =
        "YouTube could not load. Check your internet connection or browser settings.";
};
document.head.appendChild(youtubeScript);

/* WATCH WHICH CARD IS VISIBLE */
function setupObserver() {
    if (observer) observer.disconnect();

    observer = new IntersectionObserver(entries => {
        const visibleCards = entries
            .filter(entry => entry.isIntersecting)
            .sort((a, b) => b.intersectionRatio - a.intersectionRatio);

        if (!visibleCards.length) return;

        const best = visibleCards[0];

        if (best.intersectionRatio >= 0.60) {
            activateCard(best.target);
        }
    }, {
        root: shortsList,
        threshold: [0.2, 0.6, 0.9]
    });

    cards.forEach(card => observer.observe(card));
}

/* ACTIVATE VISIBLE SHORT */
function activateCard(card) {
    if (activeCard === card) return;

    activeCard = card;
    const id = card.dataset.id;

    /* Pause all other Shorts */
    players.forEach((player, playerId) => {
        if (playerId !== id) {
            try {
                player.pauseVideo();
            } catch (error) {}
        }
    });

    playActiveVideo(card);
}

/* PLAY VISIBLE VIDEO */
function playActiveVideo(card) {
    if (!card || card !== activeCard) return;

    const player = players.get(card.dataset.id);
    if (!player) return;

    try {
        player.mute();
        player.playVideo();
    } catch (error) {
        console.warn("Could not start video:", error);
    }
}

/* CUSTOM PLAY / PAUSE BUTTON */
function togglePlayback(id) {
    const card = cards.find(item => item.dataset.id === id);
    const player = players.get(id);

    if (!player || !card) {
        apiMessage.textContent = "YouTube player is still loading.";
        return;
    }

    if (activeCard !== card) {
        activateCard(card);
    }

    try {
        const state = player.getPlayerState();

        if (state === YT.PlayerState.PLAYING) {
            player.pauseVideo();
        } else {
            /* User clicked: allow sound if browser permits */
            player.unMute();
            player.playVideo();
        }
    } catch (error) {
        console.warn(error);
    }
}

function updatePlayButton(id, state) {
    const button = document.querySelector(
        `.play-button[data-id="${id}"]`
    );

    if (!button) return;

    button.textContent =
        state === YT.PlayerState.PLAYING ? "Ⅱ" : "▶";
}

/* PLAY NEXT SHORT WHEN CURRENT ONE ENDS */
function playNextVideo(card) {
    const index = cards.indexOf(card);
    const nextCard = cards[index + 1];

    if (nextCard) {
        nextCard.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }
}

/* LIKE BUTTON — LOCAL DEMO ONLY */
function toggleLike(id, button) {
    const liked = !likedVideos.has(id);

    if (liked) {
        likedVideos.add(id);
    } else {
        likedVideos.delete(id);
    }

    button.classList.toggle("liked", liked);
    button.setAttribute("aria-pressed", String(liked));

    const count = document.getElementById(`likes-${id}`);
    if (count) count.textContent = liked ? "Liked" : "Like";
}

/* SHARE VIDEO */
async function shareVideo(id) {
    const url = `https://www.youtube.com/shorts/${id}`;

    try {
        if (navigator.share) {
            await navigator.share({
                title: "Watch this Short",
                url: url
            });
        } else if (navigator.clipboard) {
            await navigator.clipboard.writeText(url);
            apiMessage.textContent = "Video link copied!";
        } else {
            window.open(url, "_blank", "noopener");
        }
    } catch (error) {
        /* Sharing may be cancelled by the user */
    }
}

/* HANDLE BUTTON CLICKS */
shortsList.addEventListener("click", event => {
    const button = event.target.closest("[data-action]");
    if (!button) return;

    const id = button.dataset.id;
    const action = button.dataset.action;

    if (action === "play") {
        togglePlayback(id);
    }

    if (action === "like") {
        toggleLike(id, button);
    }

    if (action === "share") {
        shareVideo(id);
    }
});

/* SHUFFLE AND REBUILD THE FEED */
shuffleBtn.addEventListener("click", () => {
    if (observer) observer.disconnect();

    players.forEach(player => {
        try {
            player.destroy();
        } catch (error) {}
    });

    players.clear();
    activeCard = null;

    renderShorts();

    shortsList.scrollTo({
        top: 0,
        behavior: "instant"
    });
});

/* PAUSE VIDEOS WHEN TAB IS HIDDEN */
document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        players.forEach(player => {
            try {
                player.pauseVideo();
            } catch (error) {}
        });
    } else if (activeCard) {
        playActiveVideo(activeCard);
    }
});

/* RENDER THE COMPLETE FEED */
renderShorts();
</script>

</body>
</html>
