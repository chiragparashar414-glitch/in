<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Watch movies and series on VyaHotstar.">

    <title>VyaHotstar Player</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;

            background: #000;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =====================================================
           PLAYER
        ===================================================== */

        .player-container {
            position: relative;

            width: 100%;
            height: 100vh;

            background: #000;

            overflow: hidden;
        }


        /* =====================================================
           YOUTUBE
        ===================================================== */

        #youtubePlayer {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            border: 0;

            background: #000;
        }


        /* =====================================================
           TOP BAR
        ===================================================== */

        .top-bar {
            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            z-index: 20;

            height: 100px;

            display: flex;
            align-items: flex-start;

            padding: 22px 28px;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.9),
                    rgba(0, 0, 0, 0.45),
                    transparent
                );

            opacity: 1;

            transition:
                opacity 0.35s ease,
                transform 0.35s ease;
        }


        /* =====================================================
           BRAND
        ===================================================== */

        .player-brand {
            display: flex;
            align-items: center;

            gap: 10px;

            margin-right: 22px;

            color: #fff;

            font-size: 17px;
            font-weight: 800;

            white-space: nowrap;
        }

        .brand-star {
            width: 34px;
            height: 34px;

            display: grid;
            place-items: center;

            background:
                linear-gradient(
                    135deg,
                    #ff2100,
                    #ff6500
                );

            color: #fff;

            font-size: 17px;
            font-weight: 900;

            clip-path: polygon(
                50% 0%,
                61% 35%,
                98% 35%,
                68% 56%,
                79% 92%,
                50% 70%,
                21% 92%,
                32% 56%,
                2% 35%,
                39% 35%
            );

            filter:
                drop-shadow(
                    0 0 10px
                    rgba(255, 55, 15, 0.45)
                );
        }


        /* =====================================================
           BACK BUTTON
        ===================================================== */

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 38px;

            padding: 0 14px;

            border:
                1px solid
                rgba(255, 255, 255, 0.14);

            border-radius: 7px;

            background:
                rgba(10, 10, 12, 0.58);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            color: #fff;

            text-decoration: none;

            font-size: 13px;
            font-weight: 700;

            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                transform 0.25s ease;
        }

        .back-btn:hover {
            background:
                rgba(255, 59, 18, 0.9);

            border-color:
                rgba(255, 100, 50, 0.9);

            transform: translateY(-1px);
        }


        /* =====================================================
           MOVIE TITLE
        ===================================================== */

        #movieTitle {
            display: flex;
            align-items: center;

            min-height: 38px;

            margin-left: 16px;

            color: #fff;

            font-size: 16px;
            font-weight: 700;

            letter-spacing: 0.1px;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.8);
        }


        /* =====================================================
           FULLSCREEN
        ===================================================== */

        .fullscreen-btn {
            margin-left: auto;

            min-height: 38px;

            padding: 0 15px;

            border:
                1px solid
                rgba(255, 255, 255, 0.14);

            border-radius: 7px;

            background:
                rgba(10, 10, 12, 0.58);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            color: #fff;

            cursor: pointer;

            font-size: 13px;
            font-weight: 700;

            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                transform 0.25s ease;
        }

        .fullscreen-btn:hover {
            background:
                rgba(255, 59, 18, 0.9);

            border-color:
                rgba(255, 100, 50, 0.9);

            transform: translateY(-1px);
        }


        /* =====================================================
           BOTTOM CINEMATIC GRADIENT
        ===================================================== */

        .bottom-gradient {
            position: absolute;

            z-index: 5;

            left: 0;
            right: 0;
            bottom: 0;

            height: 150px;

            pointer-events: none;

            background:
                linear-gradient(
                    to top,
                    rgba(0, 0, 0, 0.72),
                    transparent
                );
        }


        /* =====================================================
           PLAYER STATUS
        ===================================================== */

        .player-status {
            position: absolute;

            z-index: 10;

            left: 28px;
            bottom: 25px;

            display: flex;
            align-items: center;

            gap: 8px;

            color:
                rgba(255, 255, 255, 0.55);

            font-size: 11px;

            pointer-events: none;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #ff4216;

            box-shadow:
                0 0 10px
                rgba(255, 66, 22, 0.8);
        }


        /* =====================================================
           HIDE UI
        ===================================================== */

        .player-container.controls-hidden .top-bar {
            opacity: 0;

            transform:
                translateY(-15px);

            pointer-events: none;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 700px) {

            .top-bar {
                height: 90px;

                padding:
                    15px 14px;
            }

            .player-brand {
                margin-right: 8px;

                font-size: 0;
            }

            .brand-star {
                width: 32px;
                height: 32px;
            }

            .back-btn {
                min-height: 35px;

                padding: 0 11px;

                font-size: 12px;
            }

            #movieTitle {
                max-width: 40vw;

                margin-left: 9px;

                overflow: hidden;

                white-space: nowrap;
                text-overflow: ellipsis;

                font-size: 13px;
            }

            .fullscreen-btn {
                min-height: 35px;

                padding: 0 10px;

                font-size: 0;
            }

            .fullscreen-btn::before {
                content: "⛶";

                font-size: 18px;
            }

            .player-status {
                left: 15px;
                bottom: 18px;
            }

            .bottom-gradient {
                height: 110px;
            }
        }


        @media (max-width: 420px) {

            .player-brand {
                display: none;
            }

            #movieTitle {
                max-width: 42vw;
            }
        }


        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            * {
                transition: none !important;
            }

        }

    </style>
</head>


<body>

    <div
        class="player-container"
        id="playerContainer">


        <!-- =================================================
             YOUTUBE VIDEO
        ================================================== -->

        <iframe
            id="youtubePlayer"

            src=""

            title="VyaHotstar video player"

            frameborder="0"

            allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
                web-share
            "

            referrerpolicy="strict-origin-when-cross-origin"

            allowfullscreen>
        </iframe>


        <!-- =================================================
             TOP BAR
        ================================================== -->

        <div class="top-bar">


            <!-- VyaHotstar Brand -->

            <div class="player-brand">

                <div class="brand-star">
                    ★
                </div>

                <span>
                    VyaHotstar
                </span>

            </div>


            <!-- Back -->

            <a
                href="index.html"
                class="back-btn">

                ← Back

            </a>


            <!-- Movie Title -->

            <span id="movieTitle">
                Loading...
            </span>


            <!-- Fullscreen -->

            <button
                class="fullscreen-btn"
                onclick="goFullscreen()">

                ⛶ Fullscreen

            </button>

        </div>


        <!-- =================================================
             BOTTOM GRADIENT
        ================================================== -->

        <div class="bottom-gradient"></div>


        <!-- =================================================
             STATUS
        ================================================== -->

        <div class="player-status">

            <span class="status-dot"></span>

            <span>
                VyaHotstar Player
            </span>

        </div>


    </div>


    <script>

        /* =====================================================
           GET URL PARAMETERS
        ===================================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        /*
            Example:

            player.html
            ?title=Kurukshetra
            &video=G-3JSyi_Ss0
        */

        const title =
            params.get("title")
            || "Kurukshetra";


        const videoId =
            params.get("video")
            || "G-3JSyi_Ss0";


        /* =====================================================
           SET TITLE
        ===================================================== */

        document.getElementById(
            "movieTitle"
        ).textContent = title;


        document.title =
            title + " | VyaHotstar";


        /* =====================================================
           YOUTUBE URL
        ===================================================== */

        const youtubeURL =
            "https://www.youtube-nocookie.com/embed/"
            + encodeURIComponent(videoId)
            + "?autoplay=1"
            + "&rel=0"
            + "&modestbranding=1"
            + "&playsinline=1"
            + "&controls=1";


        /* =====================================================
           LOAD VIDEO
        ===================================================== */

        document.getElementById(
            "youtubePlayer"
        ).src = youtubeURL;


        /* =====================================================
           FULLSCREEN
        ===================================================== */

        function goFullscreen() {

            const container =
                document.getElementById(
                    "playerContainer"
                );


            if (container.requestFullscreen) {

                container.requestFullscreen();

            }

            else if (
                container.webkitRequestFullscreen
            ) {

                container.webkitRequestFullscreen();

            }

            else if (
                container.msRequestFullscreen
            ) {

                container.msRequestFullscreen();

            }

        }


        /* =====================================================
           AUTO-HIDE TOP BAR
        ===================================================== */

        const container =
            document.getElementById(
                "playerContainer"
            );


        let hideTimer;


        function showControls() {

            container.classList.remove(
                "controls-hidden"
            );


            clearTimeout(hideTimer);


            hideTimer =
                setTimeout(
                    () => {

                        container.classList.add(
                            "controls-hidden"
                        );

                    },
                    4000
                );

        }


        container.addEventListener(
            "mousemove",
            showControls
        );


        container.addEventListener(
            "touchstart",
            showControls,
            {
                passive: true
            }
        );


        showControls();


    </script>

</body>
</html>
