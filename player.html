<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="VyaHotstar custom cinematic video player">

    <title>VyaHotstar Player</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            background: #000;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =====================================================
           PLAYER CONTAINER
        ===================================================== */

        .player-container {

            position: relative;

            width: 100%;
            height: 100vh;

            background: #000;

            overflow: hidden;
        }


        /* =====================================================
           YOUTUBE IFRAME
        ===================================================== */

        #youtubePlayer {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            border: 0;

            background: #000;
        }


        /* =====================================================
           VYAHOTSTAR TOP BAR
        ===================================================== */

        .top-bar {

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            z-index: 20;

            height: 105px;

            display: flex;
            align-items: flex-start;

            padding: 22px 28px;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.9),
                    rgba(0, 0, 0, 0.35),
                    transparent
                );

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }


        /* =====================================================
           BRAND
        ===================================================== */

        .brand {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-right: 20px;

            color: #fff;

            font-size: 17px;
            font-weight: 800;

            white-space: nowrap;
        }


        .brand-star {

            width: 36px;
            height: 36px;

            display: grid;

            place-items: center;

            background:
                linear-gradient(
                    135deg,
                    #ff2400,
                    #ff681c
                );

            color: #fff;

            font-size: 18px;
            font-weight: 900;

            clip-path: polygon(
                50% 0%,
                61% 35%,
                98% 35%,
                68% 56%,
                79% 92%,
                50% 70%,
                21% 92%,
                32% 56%,
                2% 35%,
                39% 35%
            );

            filter:
                drop-shadow(
                    0 0 12px
                    rgba(255, 65, 20, 0.5)
                );
        }


        /* =====================================================
           BACK BUTTON
        ===================================================== */

        .back-btn {

            display: inline-flex;

            align-items: center;
            justify-content: center;

            height: 40px;

            padding: 0 15px;

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 7px;

            background:
                rgba(10, 10, 12, 0.65);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            color: #fff;

            text-decoration: none;

            font-size: 13px;
            font-weight: 700;

            transition: 0.25s ease;
        }


        .back-btn:hover {

            background:
                linear-gradient(
                    135deg,
                    #ff2400,
                    #ff681c
                );

            border-color: transparent;

            transform:
                translateY(-2px);
        }


        /* =====================================================
           MOVIE TITLE
        ===================================================== */

        #movieTitle {

            display: flex;

            align-items: center;

            height: 40px;

            margin-left: 15px;

            color: #fff;

            font-size: 17px;

            font-weight: 700;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.8);
        }


        /* =====================================================
           CUSTOM FULLSCREEN BUTTON
        ===================================================== */

        .fullscreen-top {

            margin-left: auto;

            height: 40px;

            padding: 0 15px;

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 7px;

            background:
                rgba(10, 10, 12, 0.65);

            color: #fff;

            cursor: pointer;

            backdrop-filter: blur(12px);

            font-size: 13px;

            font-weight: 700;

            transition: 0.25s ease;
        }


        .fullscreen-top:hover {

            background:
                linear-gradient(
                    135deg,
                    #ff2400,
                    #ff681c
                );

            border-color: transparent;
        }


        /* =====================================================
           BOTTOM CONTROL AREA
        ===================================================== */

        .controls {

            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 30;

            padding:
                45px 30px 25px;

            background:
                linear-gradient(
                    to top,
                    rgba(0, 0, 0, 0.92),
                    rgba(0, 0, 0, 0.55),
                    transparent
                );

            opacity: 1;

            transform:
                translateY(0);

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }


        /* =====================================================
           PROGRESS BAR
        ===================================================== */

        .progress-container {

            width: 100%;

            height: 5px;

            margin-bottom: 18px;

            border-radius: 10px;

            background:
                rgba(255, 255, 255, 0.22);

            cursor: pointer;

            overflow: hidden;
        }


        .progress {

            width: 0%;

            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #ff2400,
                    #ff681c
                );

            transition:
                width 0.15s linear;
        }


        /* =====================================================
           CONTROL ROW
        ===================================================== */

        .control-row {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        /* =====================================================
           CONTROL BUTTON
        ===================================================== */

        .control-btn {

            width: 42px;
            height: 42px;

            display: grid;

            place-items: center;

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.08);

            color: #fff;

            cursor: pointer;

            font-size: 16px;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .control-btn:hover {

            background:
                linear-gradient(
                    135deg,
                    #ff2400,
                    #ff681c
                );

            transform:
                scale(1.08);
        }


        /* =====================================================
           PLAY BUTTON
        ===================================================== */

        #playButton {

            width: 48px;
            height: 48px;

            background:
                linear-gradient(
                    135deg,
                    #ff2400,
                    #ff681c
                );

            border: none;

            box-shadow:
                0 6px 22px
                rgba(255, 55, 15, 0.3);
        }


        #playButton:hover {

            transform:
                scale(1.1);

            box-shadow:
                0 8px 28px
                rgba(255, 55, 15, 0.45);
        }


        /* =====================================================
           TIME
        ===================================================== */

        .time {

            min-width: 105px;

            margin-left: 5px;

            color:
                rgba(255, 255, 255, 0.75);

            font-size: 12px;

            font-weight: 600;

            user-select: none;
        }


        /* =====================================================
           SPACER
        ===================================================== */

        .control-spacer {

            flex: 1;
        }


        /* =====================================================
           VOLUME
        ===================================================== */

        .volume-wrapper {

            display: flex;

            align-items: center;

            gap: 7px;
        }


        .volume-slider {

            width: 75px;

            accent-color: #ff4317;

            cursor: pointer;
        }


        /* =====================================================
           HIDDEN CONTROLS
        ===================================================== */

        .player-container.controls-hidden
        .controls {

            opacity: 0;

            transform:
                translateY(20px);

            pointer-events: none;
        }


        .player-container.controls-hidden
        .top-bar {

            opacity: 0;

            transform:
                translateY(-15px);

            pointer-events: none;
        }


        /* =====================================================
           CENTER PLAY BUTTON
        ===================================================== */

        .center-play {

            position: absolute;

            z-index: 15;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%)
                scale(1);

            width: 76px;
            height: 76px;

            display: grid;

            place-items: center;

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            border-radius: 50%;

            background:
                rgba(10, 10, 10, 0.55);

            backdrop-filter:
                blur(10px);

            color: #fff;

            font-size: 28px;

            cursor: pointer;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease,
                background 0.25s ease;
        }


        .center-play:hover {

            background:
                linear-gradient(
                    135deg,
                    #ff2400,
                    #ff681c
                );

            transform:
                translate(-50%, -50%)
                scale(1.08);
        }


        .center-play.hidden {

            opacity: 0;

            pointer-events: none;

            transform:
                translate(-50%, -50%)
                scale(0.75);
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .top-bar {

                height: 85px;

                padding:
                    14px 14px;
            }


            .brand span {

                display: none;
            }


            .brand {

                margin-right: 8px;
            }


            .brand-star {

                width: 32px;
                height: 32px;
            }


            .back-btn {

                height: 36px;

                padding: 0 11px;

                font-size: 12px;
            }


            #movieTitle {

                max-width: 40vw;

                height: 36px;

                margin-left: 8px;

                overflow: hidden;

                text-overflow: ellipsis;

                white-space: nowrap;

                font-size: 13px;
            }


            .fullscreen-top {

                width: 40px;

                height: 36px;

                padding: 0;

                font-size: 0;
            }


            .fullscreen-top::before {

                content: "⛶";

                font-size: 17px;
            }


            .controls {

                padding:
                    35px 12px 14px;
            }


            .control-btn {

                width: 36px;
                height: 36px;

                font-size: 14px;
            }


            #playButton {

                width: 43px;
                height: 43px;
            }


            .time {

                min-width: 80px;

                font-size: 10px;
            }


            .volume-slider {

                width: 50px;
            }


            .center-play {

                width: 62px;
                height: 62px;

                font-size: 23px;
            }

        }


        @media (max-width: 420px) {

            .volume-wrapper {

                display: none;
            }


            .time {

                min-width: auto;
            }

        }


        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            * {

                transition:
                    none !important;
            }

        }

    </style>

</head>


<body>


<div
    class="player-container"
    id="playerContainer">


    <!-- =====================================================
         YOUTUBE PLAYER
    ===================================================== -->

    <div id="youtubePlayer"></div>


    <!-- =====================================================
         TOP BAR
    ===================================================== -->

    <div class="top-bar">


        <div class="brand">

            <div class="brand-star">
                ★
            </div>

            <span>
                VyaHotstar
            </span>

        </div>


        <a
            href="index.html"
            class="back-btn">

            ← Back

        </a>


        <span id="movieTitle">
            Loading...
        </span>


        <button
            class="fullscreen-top"
            id="fullscreenTopButton"
            type="button">

            ⛶ Fullscreen

        </button>

    </div>


    <!-- =====================================================
         CENTER PLAY
    ===================================================== -->

    <button
        class="center-play"
        id="centerPlay"
        type="button"
        aria-label="Play">

        ▶

    </button>


    <!-- =====================================================
         CUSTOM CONTROLS
    ===================================================== -->

    <div
        class="controls"
        id="controls">


        <!-- Progress -->

        <div
            class="progress-container"
            id="progressContainer">

            <div
                class="progress"
                id="progress">
            </div>

        </div>


        <!-- Control Row -->

        <div class="control-row">


            <!-- Play/Pause -->

            <button
                class="control-btn"
                id="playButton"
                type="button"
                aria-label="Play">

                ▶

            </button>


            <!-- Rewind -->

            <button
                class="control-btn"
                id="rewindButton"
                type="button"
                aria-label="Rewind 10 seconds">

                ↶

            </button>


            <!-- Forward -->

            <button
                class="control-btn"
                id="forwardButton"
                type="button"
                aria-label="Forward 10 seconds">

                ↷

            </button>


            <!-- Time -->

            <div
                class="time"
                id="timeDisplay">

                00:00 / 00:00

            </div>


            <div class="control-spacer"></div>


            <!-- Volume -->

            <div class="volume-wrapper">

                <button
                    class="control-btn"
                    id="muteButton"
                    type="button"
                    aria-label="Mute">

                    🔊

                </button>


                <input
                    type="range"
                    class="volume-slider"
                    id="volumeSlider"
                    min="0"
                    max="100"
                    value="100"
                    aria-label="Volume">

            </div>


            <!-- Fullscreen -->

            <button
                class="control-btn"
                id="fullscreenButton"
                type="button"
                aria-label="Fullscreen">

                ⛶

            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     YOUTUBE IFRAME PLAYER API
========================================================= -->

<script src="https://www.youtube.com/iframe_api"></script>


<script>

    /* ========================================================
       URL PARAMETERS
    ======================================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const movieTitle =
        params.get("title")
        || "Kurukshetra";


    const videoId =
        params.get("video")
        || "G-3JSyi_Ss0";


    document.getElementById(
        "movieTitle"
    ).textContent = movieTitle;


    document.title =
        movieTitle + " | VyaHotstar";


    /* ========================================================
       PLAYER VARIABLES
    ======================================================== */

    let player = null;

    let progressTimer = null;

    let hideTimer = null;


    const container =
        document.getElementById(
            "playerContainer"
        );


    const playButton =
        document.getElementById(
            "playButton"
        );


    const centerPlay =
        document.getElementById(
            "centerPlay"
        );


    const progress =
        document.getElementById(
            "progress"
        );


    const progressContainer =
        document.getElementById(
            "progressContainer"
        );


    const timeDisplay =
        document.getElementById(
            "timeDisplay"
        );


    const volumeSlider =
        document.getElementById(
            "volumeSlider"
        );


    const muteButton =
        document.getElementById(
            "muteButton"
        );


    /* ========================================================
       YOUTUBE API READY
    ======================================================== */

    function onYouTubeIframeAPIReady() {

        player =
            new YT.Player(
                "youtubePlayer",
                {

                    width: "100%",

                    height: "100%",

                    videoId: videoId,

                    playerVars: {

                        autoplay: 1,

                        controls: 0,

                        disablekb: 1,

                        fs: 0,

                        modestbranding: 1,

                        rel: 0,

                        iv_load_policy: 3,

                        playsinline: 1

                    },


                    events: {

                        onReady:
                            onPlayerReady,

                        onStateChange:
                            onPlayerStateChange

                    }

                }
            );

    }


    /* ========================================================
       PLAYER READY
    ======================================================== */

    function onPlayerReady(event) {

        event.target.setVolume(100);

        updateTime();

        startProgressTimer();

        showControls();

    }


    /* ========================================================
       PLAYER STATE
    ======================================================== */

    function onPlayerStateChange(event) {

        if (
            event.data ===
            YT.PlayerState.PLAYING
        ) {

            playButton.textContent = "❚❚";

            playButton.setAttribute(
                "aria-label",
                "Pause"
            );

            centerPlay.classList.add(
                "hidden"
            );

            startProgressTimer();

        }


        else if (
            event.data ===
            YT.PlayerState.PAUSED
        ) {

            playButton.textContent = "▶";

            playButton.setAttribute(
                "aria-label",
                "Play"
            );

            centerPlay.classList.remove(
                "hidden"
            );

            stopProgressTimer();

            showControls();

        }


        else if (
            event.data ===
            YT.PlayerState.ENDED
        ) {

            playButton.textContent = "▶";

            centerPlay.classList.remove(
                "hidden"
            );

            stopProgressTimer();

            progress.style.width = "100%";

            showControls();

        }

    }


    /* ========================================================
       PLAY / PAUSE
    ======================================================== */

    function togglePlay() {

        if (!player) return;


        const state =
            player.getPlayerState();


        if (
            state ===
            YT.PlayerState.PLAYING
        ) {

            player.pauseVideo();

        }

        else {

            player.playVideo();

        }

    }


    playButton.addEventListener(
        "click",
        togglePlay
    );


    centerPlay.addEventListener(
        "click",
        togglePlay
    );


    /* ========================================================
       REWIND
    ======================================================== */

    document.getElementById(
        "rewindButton"
    ).addEventListener(
        "click",
        function () {

            if (!player) return;

            const current =
                player.getCurrentTime();

            player.seekTo(
                Math.max(
                    current - 10,
                    0
                ),
                true
            );

            showControls();

        }
    );


    /* ========================================================
       FORWARD
    ======================================================== */

    document.getElementById(
        "forwardButton"
    ).addEventListener(
        "click",
        function () {

            if (!player) return;

            const current =
                player.getCurrentTime();

            const duration =
                player.getDuration();

            player.seekTo(
                Math.min(
                    current + 10,
                    duration
                ),
                true
            );

            showControls();

        }
    );


    /* ========================================================
       PROGRESS UPDATE
    ======================================================== */

    function startProgressTimer() {

        stopProgressTimer();

        progressTimer =
            setInterval(
                updateTime,
                250
            );

    }


    function stopProgressTimer() {

        if (progressTimer) {

            clearInterval(
                progressTimer
            );

            progressTimer = null;

        }

    }


    function updateTime() {

        if (!player) return;


        const current =
            player.getCurrentTime();


        const duration =
            player.getDuration();


        if (!duration) return;


        const percentage =
            (current / duration) * 100;


        progress.style.width =
            percentage + "%";


        timeDisplay.textContent =
            formatTime(current)
            + " / "
            + formatTime(duration);

    }


    /* ========================================================
       FORMAT TIME
    ======================================================== */

    function formatTime(seconds) {

        if (!seconds || isNaN(seconds)) {

            return "00:00";

        }


        seconds =
            Math.floor(seconds);


        const minutes =
            Math.floor(
                seconds / 60
            );


        const remainingSeconds =
            seconds % 60;


        return (
            String(minutes)
                .padStart(2, "0")
            + ":"
            +
            String(remainingSeconds)
                .padStart(2, "0")
        );

    }


    /* ========================================================
       SEEK USING PROGRESS BAR
    ======================================================== */

    progressContainer.addEventListener(
        "click",
        function (event) {

            if (!player) return;


            const rect =
                progressContainer
                    .getBoundingClientRect();


            const position =
                (
                    event.clientX
                    - rect.left
                )
                / rect.width;


            const duration =
                player.getDuration();


            player.seekTo(
                duration * position,
                true
            );


            showControls();

        }
    );


    /* ========================================================
       VOLUME
    ======================================================== */

    volumeSlider.addEventListener(
        "input",
        function () {

            if (!player) return;


            const volume =
                Number(
                    this.value
                );


            player.setVolume(
                volume
            );


            if (volume === 0) {

                muteButton.textContent =
                    "🔇";

            }

            else {

                muteButton.textContent =
                    "🔊";

            }

        }
    );


    /* ========================================================
       MUTE
    ======================================================== */

    muteButton.addEventListener(
        "click",
        function () {

            if (!player) return;


            if (player.isMuted()) {

                player.unMute();

                const volume =
                    player.getVolume();

                volumeSlider.value =
                    volume;

                muteButton.textContent =
                    "🔊";

            }

            else {

                player.mute();

                volumeSlider.value = 0;

                muteButton.textContent =
                    "🔇";

            }

            showControls();

        }
    );


    /* ========================================================
       FULLSCREEN
    ======================================================== */

    function goFullscreen() {

        if (
            document.fullscreenElement
        ) {

            document.exitFullscreen();

            return;

        }


        if (
            container.requestFullscreen
        ) {

            container.requestFullscreen();

        }

        else if (
            container.webkitRequestFullscreen
        ) {

            container.webkitRequestFullscreen();

        }

    }


    document.getElementById(
        "fullscreenButton"
    ).addEventListener(
        "click",
        goFullscreen
    );


    document.getElementById(
        "fullscreenTopButton"
    ).addEventListener(
        "click",
        goFullscreen
    );


    /* ========================================================
       SHOW / HIDE CONTROLS
    ======================================================== */

    function showControls() {

        container.classList.remove(
            "controls-hidden"
        );


        clearTimeout(
            hideTimer
        );


        hideTimer =
            setTimeout(
                function () {

                    if (
                        player &&
                        player.getPlayerState()
                        === YT.PlayerState.PLAYING
                    ) {

                        container.classList.add(
                            "controls-hidden"
                        );

                    }

                },
                3500
            );

    }


    container.addEventListener(
        "mousemove",
        showControls
    );


    container.addEventListener(
        "touchstart",
        showControls,
        {
            passive: true
        }
    );


    /* ========================================================
       KEYBOARD CONTROLS
    ======================================================== */

    document.addEventListener(
        "keydown",
        function (event) {

            if (!player) return;


            switch (event.code) {


                case "Space":

                    event.preventDefault();

                    togglePlay();

                    showControls();

                    break;


                case "ArrowLeft":

                    event.preventDefault();

                    player.seekTo(
                        Math.max(
                            player.getCurrentTime() - 10,
                            0
                        ),
                        true
                    );

                    showControls();

                    break;


                case "ArrowRight":

                    event.preventDefault();

                    player.seekTo(
                        Math.min(
                            player.getCurrentTime() + 10,
                            player.getDuration()
                        ),
                        true
                    );

                    showControls();

                    break;


                case "KeyM":

                    event.preventDefault();

                    muteButton.click();

                    break;


                case "KeyF":

                    event.preventDefault();

                    goFullscreen();

                    break;

            }

        }
    );


    /* ========================================================
       INITIAL CONTROL VISIBILITY
    ======================================================== */

    showControls();

</script>


</body>
</html>
