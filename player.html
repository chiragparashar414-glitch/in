<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>VyaHotstar Player</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        .player-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #000;
        }

        /* YouTube Player */
        #youtubePlayer {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Top Bar */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;

            z-index: 10;

            display: flex;
            align-items: center;

            padding: 20px 25px;

            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.85),
                transparent
            );
        }

        /* Back Button */
        .back-btn {
            padding: 10px 16px;

            color: #fff;
            background: rgba(0, 0, 0, 0.7);

            border-radius: 5px;

            text-decoration: none;
            font-size: 14px;

            transition: 0.25s;
        }

        .back-btn:hover {
            background: #00d9ff;
            color: #000;
        }

        /* Title */
        #movieTitle {
            margin-left: 20px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }

        /* Fullscreen */
        .fullscreen-btn {
            margin-left: auto;

            padding: 10px 15px;

            border: none;
            border-radius: 5px;

            background: rgba(0, 0, 0, 0.7);
            color: #fff;

            cursor: pointer;

            font-size: 14px;
        }

        .fullscreen-btn:hover {
            background: #00d9ff;
            color: #000;
        }

    </style>
</head>

<body>


<div
    class="player-container"
    id="playerContainer">


    <!-- Top Controls -->
    <div class="top-bar">

        <a
            href="index.html"
            class="back-btn">
            ← Back
        </a>

        <span id="movieTitle">
            Loading...
        </span>

        <button
            class="fullscreen-btn"
            onclick="goFullscreen()">
            ⛶ Fullscreen
        </button>

    </div>


    <!-- YouTube Embed -->
    <iframe
        id="youtubePlayer"

        src=""

        title="YouTube video player"

        frameborder="0"

        allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share
        "

        referrerpolicy="strict-origin-when-cross-origin"

        allowfullscreen>
    </iframe>


</div>


<script>

    /*
        Get data from URL
    */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const title =
        params.get("title") || "Movie";


    const videoId =
        params.get("video") || "G-3JSyi_Ss0";


    /*
        Set movie title
    */

    document.getElementById(
        "movieTitle"
    ).textContent = title;


    /*
        YouTube embed URL

        Your supplied video:
        G-3JSyi_Ss0
    */

    const youtubeURL =
        "https://www.youtube.com/embed/"
        + videoId
        + "?autoplay=1"
        + "&rel=0"
        + "&modestbranding=1";


    /*
        Load YouTube player
    */

    document.getElementById(
        "youtubePlayer"
    ).src = youtubeURL;


    /*
        Fullscreen
    */

    function goFullscreen() {

        const container =
            document.getElementById(
                "playerContainer"
            );


        if (container.requestFullscreen) {

            container.requestFullscreen();

        }

        else if (
            container.webkitRequestFullscreen
        ) {

            container.webkitRequestFullscreen();

        }

        else if (
            container.msRequestFullscreen
        ) {

            container.msRequestFullscreen();

        }

    }

</script>

</body>
</html>
