        .sidebar {
            width: 240px;

            display: flex;
            flex-direction: column;

            position: fixed;
            left: 0;
            top: 0;

            border-right: 1px solid #333;
        }

        /* Logo */
        .logo {
            color: #ffffff;
            font-size: 26px;

            text-align: center;

            margin-bottom: 40px;
        }

        .logo span {
            color: #e50914;
        }

        /* Navigation */
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-links a {
            display: flex;
            align-items: center;

            gap: 15px;

            padding: 14px 15px;

            color: #b3b3b3;
            text-decoration: none;

            border-radius: 8px;

            font-size: 16px;
            font-weight: 500;

            transition: all 0.3s ease;
        }

        /* Icons */
        .nav-links svg {
            width: 22px;
            height: 22px;

            fill: currentColor;

            flex-shrink: 0;
        }

        /* Hover */
        .nav-links a:hover {
            background: #2b2b2b;
            color: #ffffff;
        }

        /* Active link */
        .nav-links a.active {
            background: #e50914;
            color: #ffffff;
        }

        .nav-links a.active:hover {
            background: #f40612;
        }

        /* Main content */
        .main-content {
            margin-left: 240px;
            width: calc(100% - 240px);

            padding: 50px;

            color: white;
        }

        .main-content h1 {
            margin-bottom: 15px;
        }

        .main-content p {
            color: #aaa;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .sidebar {
                width: 75px;
                padding: 25px 10px;
            }

            .logo {
                font-size: 18px;

            }

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";


        const firebaseConfig = {
            apiKey: "AIzaSyA7-r3JHQTHC6PsaEv1iglZw_fm_MLYdJU",
            authDomain: "login-vya.firebaseapp.com",
            projectId: "login-vya",
            storageBucket: "login-vya.appspot.com",
            messagingSenderId: "626063213210",
            appId: "1:626063213210:web:9f9a42426ee1c3989d9523",
            measurementId: "G-6W8IG5ZZ5F"
        };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);


        onAuthStateChanged(auth, (user) => {

            if (user) {

                document.getElementById("userEmail").textContent =
                    user.email;

            } else {

                // User is not logged in
                window.location.href = "index.html";

            }

        });


        document.getElementById("logoutBtn").addEventListener("click", () => {

            signOut(auth)
                .then(() => {

                    localStorage.removeItem("userEmail");

                    window.location.href = "index.html";

                })
                .catch((error) => {

                    alert(error.message);

                });

        });

    </script>
