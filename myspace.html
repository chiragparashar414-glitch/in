<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VyaHotstar Sidebar</title>
    <link rel="icon" type="image/x-icon" href="Subject.png">
    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================
           BODY
        ========================= */

        body {
            min-height: 100vh;
            background: #0b0c10;
            color: white;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;

            left: 15px;
            top: 15px;

            width: 72px;
            height: calc(100vh - 30px);

            background: #17181d;

            border-radius: 18px;

            padding: 22px 10px;

            border: 1px solid #282930;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);

            overflow: hidden;

            transition: width 0.3s ease;

            z-index: 1000;
        }


        /* Expand sidebar when mouse is over it */

        .sidebar:hover {
            width: 230px;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            height: 48px;

            display: flex;
            align-items: center;

            justify-content: center;

            margin-bottom: 35px;

            white-space: nowrap;

            overflow: hidden;
        }


        .logo-icon {
            min-width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e50914;

            border-radius: 12px;

            font-size: 19px;
            font-weight: bold;

            color: white;
        }


        .logo-text {
            margin-left: 12px;

            font-size: 21px;
            font-weight: 700;

            color: white;

            opacity: 0;

            transition: opacity 0.2s ease;
        }


        .sidebar:hover .logo-text {
            opacity: 1;
        }


        .logo-text span {
            color: #e50914;
        }


        /* =========================
           NAVIGATION
        ========================= */

        .nav {
            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        /* =========================
           NAV LINK
        ========================= */

        .nav a {
            height: 52px;

            display: flex;

            align-items: center;

            text-decoration: none;

            color: #999ba3;

            border-radius: 12px;

            overflow: hidden;

            white-space: nowrap;

            transition:
                background 0.25s ease,
                color 0.25s ease;
        }


        /* =========================
           ICON CONTAINER
        ========================= */

        .icon {
            min-width: 52px;

            height: 52px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* SVG ICON */

        .icon svg {
            width: 21px;
            height: 21px;

            fill: currentColor;
        }


        /* =========================
           LABEL
        ========================= */

        .label {
            font-size: 15px;

            font-weight: 600;

            margin-left: 5px;

            opacity: 0;

            transition: opacity 0.2s ease;
        }


        .sidebar:hover .label {
            opacity: 1;
        }


        /* =========================
           HOVER
        ========================= */

        .nav a:hover {
            background: #292a30;

            color: white;
        }


        /* =========================
           ACTIVE
        ========================= */

        .nav a.active {
            background: #e50914;

            color: white;

            box-shadow: 0 5px 15px rgba(229, 9, 20, 0.25);
        }


        .nav a.active:hover {
            background: #f20d18;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .content {
            margin-left: 110px;

            padding: 50px;

            transition: margin-left 0.3s ease;
        }


        .sidebar:hover ~ .content {
            margin-left: 260px;
        }


        .content h1 {
            font-size: 32px;

            margin-bottom: 12px;
        }


        .content p {
            color: #999;

            font-size: 16px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .sidebar {
                left: 10px;
                top: 10px;

                height: calc(100vh - 20px);
            }

            .content {
                margin-left: 100px;

                padding: 30px 20px;
            }

            .sidebar:hover ~ .content {
                margin-left: 100px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        </div>


        <!-- NAVIGATION -->

        <nav class="nav">


            <!-- HOME -->

            <!-- MOVIES -->

            <a href="Movie.html">

    <main class="content">

        <h1>

        </p>

    </main>


</body>

        import {

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";


        const firebaseConfig = {
            apiKey: "AIzaSyA7-r3JHQTHC6PsaEv1iglZw_fm_MLYdJU",
            authDomain: "login-vya.firebaseapp.com",
            projectId: "login-vya",
            storageBucket: "login-vya.appspot.com",
            messagingSenderId: "626063213210",
            appId: "1:626063213210:web:9f9a42426ee1c3989d9523",
            measurementId: "G-6W8IG5ZZ5F"
        };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);


        onAuthStateChanged(auth, (user) => {

                    user.email;

            } else {

                // User is not logged in
                window.location.href = "index.html";

            }

        });


        document.getElementById("logoutBtn").addEventListener("click", () => {

            signOut(auth)
                .then(() => {

                    localStorage.removeItem("userEmail");

                    window.location.href = "index.html";

                })
                .catch((error) => {

                    alert(error.message);

                });

        });

    </script>
