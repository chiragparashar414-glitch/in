<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VYAHOTSTAR - Login/Register</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #f9f9f9; display: flex; min-height: 100vh; }
    .sidebar { height: 100%; width: 200px; position: fixed; top: 0; left: 0; padding-top: 20px; background-color: #ffffff; box-shadow: 2px 0 5px rgba(0,0,0,0.05); }
    .sidebar a { padding: 15px 20px; text-decoration: none; font-size: 18px; color: #555; display: block; transition: 0.3s; }
    .sidebar a:hover { color: #007bff; background-color: #f0f7ff; }
    .main-content { margin-left: 200px; display: flex; justify-content: center; align-items: center; width: calc(100% - 200px); padding: 20px; }
    .form-container { background-color: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    h2 { margin-bottom: 25px; font-size: 28px; color: #333; }
    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #666; font-weight: 500; }
    .input-group input { width: 100%; padding: 14px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; outline: none; transition: 0.3s; }
    .input-group input:focus { border-color: #007bff; box-shadow: 0 0 5px rgba(0,123,255,0.2); }
    button { width: 100%; padding: 16px; font-size: 16px; font-weight: bold; background-color: #007bff; color: #ffffff; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    button:hover { background-color: #0056b3; }
    p { margin-top: 20px; font-size: 14px; color: #666; }
    a { color: #007bff; text-decoration: none; font-weight: bold; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="sidebar">
    <a href="index.html">Home</a>
    <a href="TV.html">TV</a>
    <a href="Movie.html">Movies</a>
    <a href="myspace.html">My Space</a>
  </div>

  <div class="main-content">
    <div class="form-container">
      <!-- Login Section -->
      <div id="login-section">
        <h2>Welcome Back</h2>
        <form id="loginForm">
          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
          </div>
          <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="#" id="showRegister">Create Account</a></p>
      </div>

      <!-- Register Section -->
      <div id="register-section" style="display: none;">
        <h2>Create Account</h2>
        <form id="registerForm">
          <div class="input-group">
            <label for="reg-email">Email Address</label>
            <input type="email" id="reg-email" placeholder="Enter your email" required>
          </div>
          <div class="input-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" placeholder="Enter your password" required>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <p>Already have an account? <a href="#" id="showLogin">Login</a></p>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js';
    import { getAnalytics } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-analytics.js';

    const firebaseConfig = {
      apiKey: "AIzaSyA7-rJ3HQTHCGpsAElVlgLzw_fm_MLYdJU",
      authDomain: "login-vya.firebaseapp.com",
      projectId: "login-vya",
      storageBucket: "login-vya.appspot.com",
      messagingSenderId: "626063213210",
      appId: "1:626063213210:web:9f9a42426ee1c3989d9523",
      measurementId: "G-6W01GSZ2SF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const analytics = getAnalytics(app);

    const showRegister = document.getElementById('showRegister');
    const showLogin = document.getElementById('showLogin');
    const loginSection = document.getElementById('login-section');
    const registerSection = document.getElementById('register-section');

    showRegister.addEventListener('click', (e) => {
      e.preventDefault();
      loginSection.style.display = 'none';
      registerSection.style.display = 'block';
    });

    showLogin.addEventListener('click', (e) => {
      e.preventDefault();
      registerSection.style.display = 'none';
      loginSection.style.display = 'block';
    });

    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          alert("Hello! Account created successfully.");
          window.location.href = "index.html"; // Redirects to Home after Register
        })
        .catch((error) => {
          alert(error.message);
        });
    });

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          alert("Welcome back!");
          window.location.href = "index.html"; // Redirects to Home after Login
        })
        .catch((error) => {
          alert(error.message);
        });
    });
  </script>
</body>
</html>
