        ========================= */

            display: flex;

            color: #aaa;

            text-decoration: none;

            border-radius: 8px;

            font-size: 16px;
            font-weight: 600;

            transition:

                color 0.25s ease,
                transform 0.25s ease;
        }


        /* =========================
           ICON
        ========================= */

        .nav-icon {
            width: 22px;
            height: 22px;

            fill: currentColor;

            flex-shrink: 0;
        }

           HOVER
        ========================= */

        .nav-link:hover {
            background: #292929;
