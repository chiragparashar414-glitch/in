<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotstar Sidebar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0f1014;
            color: white;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;

            width: 230px;
            height: 100vh;

            background: #111217;

            display: flex;
            flex-direction: column;

            padding: 28px 14px;

            border-right: 1px solid #202127;

            z-index: 1000;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            text-align: center;

            margin-bottom: 45px;

            font-size: 27px;
            font-weight: 700;

            color: #ffffff;
        }

        .logo span {
            color: #e50914;
        }


        /* =========================
           NAVIGATION
        ========================= */

        .nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }


        /* =========================
           NAVIGATION LINK
        ========================= */

        .nav a {
            height: 52px;

            display: flex;
            align-items: center;

            gap: 17px;

            padding: 0 18px;

            color: #9b9ca2;

            text-decoration: none;

            border-radius: 8px;

            font-size: 15px;
            font-weight: 500;

            transition:
                background-color 0.25s ease,
                color 0.25s ease,
                transform 0.25s ease;
        }


        /* =========================
           ICON
        ========================= */

        .nav svg {
            width: 21px;
            height: 21px;

            fill: currentColor;

            flex-shrink: 0;
        }


        /* =========================
           HOVER
        ========================= */

        .nav a:hover {
            background: #202126;

            color: #ffffff;

            transform: translateX(3px);
        }


        /* =========================
           ACTIVE
        ========================= */

        .nav a.active {
            background: #e50914;

            color: #ffffff;

            box-shadow: 0 5px 15px rgba(229, 9, 20, 0.25);
        }

        .nav a.active:hover {
            background: #f20d18;

            transform: none;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .content {
            margin-left: 230px;

            min-height: 100vh;

            padding: 50px;
        }

        .content h1 {
            margin-bottom: 10px;
        }

        .content p {
            color: #999;
        }


        /* =========================
           MOBILE SIDEBAR
        ========================= */

        @media (max-width: 650px) {

            .sidebar {
                width: 72px;

                padding: 25px 8px;
            }

            .logo {
                font-size: 18px;

                margin-bottom: 35px;
            }

            .logo span {
                display: none;
            }

            .nav a {
                justify-content: center;

                padding: 0;

                gap: 0;
            }

            .nav a span {
                display: none;
            }

            .nav svg {
                width: 23px;
                height: 23px;
            }

            .content {
                margin-left: 72px;

                padding: 30px;
            }
        }
    </style>
</head>


<body>


    <!-- =========================
         FIXED SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <!-- Logo -->
        <div class="logo">
            Vya<span>Hotstar</span>
        </div>


        <!-- Navigation -->
        <nav class="nav">


            <!-- HOME -->
            <a href="home.html" class="active">

                <svg viewBox="0 0 24 24">
                    <path d="
                        M10 20v-6h4v6h5v-8h3L12 3
                        2 12h3v8z
                    "/>
                </svg>

                <span>Home</span>

            </a>


            <!-- TV -->
            <a href="tv.html">

                <svg viewBox="0 0 24 24">
                    <path d="
                        M21 3H3c-1.1 0-2 .9-2 2v14
                        c0 1.1.9 2 2 2h18c1.1 0
                        2-.9 2-2V5c0-1.1-.9-2-2-2z
                        M21 19H3V5h18v14z
                        M8 7H6v2h2V7zm4 0h-2v2h2V7zm4
                        0h-2v2h2V7z
                    "/>
                </svg>

                <span>TV</span>

            </a>


            <!-- MOVIES -->
            <a href="movies.html">

                <svg viewBox="0 0 24 24">
                    <path d="
                        M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2
                        4H7L5 4H3c-1.1 0-2 .9-2 2v12
                        c0 1.1.9 2 2 2h18c1.1 0
                        2-.9 2-2V6c0-1.1-.9-2-2-2h-3z
                        M21 18H3V9h18v9z
                    "/>
                </svg>

                <span>Movies</span>

            </a>


            <!-- MY SPACE -->
            <a href="my-space.html">

                <svg viewBox="0 0 24 24">
                    <path d="
                        M12 12c2.21 0 4-1.79
                        4-4s-1.79-4-4-4-4
                        1.79-4 4 1.79 4
                        4 4zm0 2c-2.67 0-8
                        1.34-8 4v2h16v-2
                        c0-2.66-5.33-4-8-4z
                    "/>
                </svg>

                <span>My Space</span>

            </a>


        </nav>

    </aside>


    <!-- PAGE CONTENT -->

    <main class="content">

        <h1>Welcome to VyaHotstar</h1>

        <p>
            Select a category from the sidebar.
        </p>

    </main>


</body>
</html>
