<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VyaHotstar Sidebar</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================
           BODY
        ========================= */

        body {
            min-height: 100vh;
            color: white;
            background: #17181d;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;

            left: 15px;
            top: 15px;

            width: 72px;
            height: calc(100vh - 30px);



            border-radius: 18px;

            padding: 22px 10px;

            border: 1px solid #282930;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);

            overflow: hidden;

            transition: width 0.3s ease;

            z-index: 1000;
        }


        /* Expand sidebar when mouse is over it */

        .sidebar:hover {
            width: 230px;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            height: 48px;

            display: flex;
            align-items: center;

            justify-content: center;

            margin-bottom: 35px;

            white-space: nowrap;

            overflow: hidden;
        }


        .logo-icon {
            min-width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e50914;

            border-radius: 12px;

            font-size: 19px;
            font-weight: bold;

            color: white;
        }


        .logo-text {
            margin-left: 12px;

            font-size: 21px;
            font-weight: 700;

            color: white;

            opacity: 0;

            transition: opacity 0.2s ease;
        }


        .sidebar:hover .logo-text {
            opacity: 1;
        }


        .logo-text span {
            color: #e50914;
        }


        /* =========================
           NAVIGATION
        ========================= */

        .nav {
            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        /* =========================
           NAV LINK
        ========================= */

        .nav a {
            height: 52px;

            display: flex;

            align-items: center;

            text-decoration: none;

            color: #999ba3;

            border-radius: 12px;

            overflow: hidden;

            white-space: nowrap;

            transition:
                background 0.25s ease,
                color 0.25s ease;
        }


        /* =========================
           ICON CONTAINER
        ========================= */

        .icon {
            min-width: 52px;

            height: 52px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* SVG ICON */

        .icon svg {
            width: 21px;
            height: 21px;

            fill: currentColor;
        }


        /* =========================
           LABEL
        ========================= */

        .label {
            font-size: 15px;

            font-weight: 600;

            margin-left: 5px;

            opacity: 0;

            transition: opacity 0.2s ease;
        }


        .sidebar:hover .label {
            opacity: 1;
        }


        /* =========================
           HOVER
        ========================= */

        .nav a:hover {
            background: #292a30;

            color: white;
        }


        /* =========================
           ACTIVE
        ========================= */

        .nav a.active {
            background: #e50914;

            color: white;

            box-shadow: 0 5px 15px rgba(229, 9, 20, 0.25);
        }


        .nav a.active:hover {
            background: #f20d18;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .content {
            margin-left: 110px;

            padding: 50px;

            transition: margin-left 0.3s ease;
        }


        .sidebar:hover ~ .content {
            margin-left: 260px;
        }


        .content h1 {
            font-size: 32px;

            margin-bottom: 12px;
        }


        .content p {
            color: #999;

            font-size: 16px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .sidebar {
                left: 10px;
                top: 10px;

                height: calc(100vh - 20px);
            }

            .content {
                margin-left: 100px;

                padding: 30px 20px;
            }

            .sidebar:hover ~ .content {
                margin-left: 100px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">


        <!-- LOGO -->

        <div class="logo">

            <div class="logo-icon">
                V
            </div>

            <div class="logo-text">
                VYA<span>+</span>
            </div>

        </div>


        <!-- NAVIGATION -->

        <nav class="nav">


            <!-- HOME -->

            <a href="index.html">

                <div class="icon">

                    <svg viewBox="0 0 24 24">

                        <path d="
                            M10 20v-6h4v6h5v-8h3L12 3
                            2 12h3v8z
                        " />

                    </svg>

                </div>

                <span class="label">
                    Home
                </span>

            </a>


            <!-- TV -->

            <a href="TV.html">

                <div class="icon">

                    <svg viewBox="0 0 24 24">

                        <path d="
                            M21 3H3c-1.1 0-2 .9-2 2v14
                            c0 1.1.9 2 2 2h18c1.1 0
                            2-.9 2-2V5c0-1.1-.9-2-2-2z
                            M21 19H3V5h18v14z
                            M8 7H6v2h2V7zm4 0h-2v2h2V7zm4
                            0h-2v2h2V7z
                        " />

                    </svg>

                </div>

                <span class="label">
                    TV
                </span>

            </a>


            <!-- MOVIES -->

            <a href="Movie.html" class="active">

                <div class="icon">

                    <svg viewBox="0 0 24 24">

                        <path d="
                            M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2
                            4H7L5 4H3c-1.1 0-2 .9-2 2v12
                            c0 1.1.9 2 2 2h18c1.1 0
                            2-.9 2-2V6c0-1.1-.9-2-2-2h-3z
                            M21 18H3V9h18v9z
                        " />

                    </svg>

                </div>

                <span class="label">
                    Movies
                </span>

            </a>


            <!-- MY SPACE -->

            <a href="myspace.html">

                <div class="icon">

                    <svg viewBox="0 0 24 24">

                        <path d="
                            M12 12c2.21 0 4-1.79
                            4-4s-1.79-4-4-4-4
                            1.79-4 4 1.79 4
                            4 4zm0 2c-2.67 0-8
                            1.34-8 4v2h16v-2
                            c0-2.66-5.33-4-8-4z
                        " />

                    </svg>

                </div>

                <span class="label">
                    My Space
                </span>

            </a>


        </nav>

    </aside>


</body>

</html>
